name: pixi

on:
  pull_request:
    types: [opened, synchronize, reopened, review_requested, ready_for_review]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel in-flight runs when a PR receives a new push; never cancel main builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build-${{ matrix.env }}-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        env: [humble, jazzy]
        platform: [linux-64, linux-aarch64, osx-arm64]
        include:
          - platform: linux-64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: osx-arm64
            runner: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false

      - name: Build workspace
        run: pixi install --locked -e ${{ matrix.env }}

      - name: Check installed Jazzy packages
        if: matrix.env == 'jazzy'
        run: pixi run --as-is -e jazzy jazzy-check

      - name: Run Jazzy protocol tests with Pixi
        if: matrix.env == 'jazzy' && matrix.platform == 'linux-64'
        timeout-minutes: 30
        env:
          AS2_TEST_DOMAIN_ID: '71'
        run: |
          pixi install --locked -e jazzy-tests
          pixi run --as-is -e jazzy-tests jazzy-test

      - name: Preserve Pixi regression reports
        if: always() && matrix.env == 'jazzy' && matrix.platform == 'linux-64'
        uses: actions/upload-artifact@v4
        with:
          name: pixi-jazzy-test-results
          path: test-results/
          if-no-files-found: warn
